kind: Ingress
apiVersion: networking.k8s.io/v1
metadata: 
  name: python-app-ingress
  namespace: default
spec: 
  ingressClassName: nginx
  rules:
  - http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service: 
              name: python-app-service
              port: 
                number: 80
