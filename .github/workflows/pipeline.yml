name: Kubernetes CI for ArgoCd using GitHub Actions
on:
  push:
   branches:
     - main
  
permissions:
  contents: read
  security-events: write


env:
  SONAR_PROJECT_KEY: biswarupgh0sh_python-app-cicd-in-kubernetes
     
jobs:
  checking_k8s_manifest:
    name: Checking the manifest of kubernetes
    uses: ./.github/workflows/validate-kubernetes-file.yml
  owasp_dependency_check:
    name: Checking for vulnerable dependency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run OWASP dependency check
        uses: dependency-check/Dependency-Check_Action@1.1.0
        with:
          project: ${{ env.SONAR_PROJECT_KEY }}
          path: "."
          format: SARIF,HTML
          args: >
            --failOnCVSS 7
            --enableRetired
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --out dependency-check-report

      - name: Upload SARIF to Github Sec
        uses: github/codeql-action/upload-sarif@v4
        with: 
          sarif_file: dependency-check-report/dependency-check-report.sarif

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report
  git_leaks_scan:
    name: Checking for leaking credentials
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code (full history for gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  sonar_scan:
    name: SonarCloud SAST Scan
    runs-on: ubuntu-latest
    outputs:
      bugs: ${{ steps.sonar_metrics.outputs.bugs }}
      vulnerabilities: ${{ steps.sonar_metrics.outputs.vulnerabilities }}
      code_smells: ${{ steps.sonar_metrics.outputs.code_smells }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install jq
      - name: SAST with SonarCloud using SonarQube
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Export SonarCloud metrics as JSON
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          curl -u "$SONAR_TOKEN:" \
          "https://sonarcloud.io/api/measures/component?component=${{ env.SONAR_PROJECT_KEY }}&metricKeys=bugs,vulnerabilities,code_smells" \
          -o sonar-report.json
      - name: Parse SonarCloud metrics
        id: sonar_metrics
        run: |
          BUGS=$(jq '.component.measures[] | select(.metric=="bugs") | .value' sonar-report.json)
          VULNERABILITIES=$(jq '.component.measures[] | select(.metric=="vulnerabilities") | .value' sonar-report.json)
          CODE_SMELLS=$(jq '.component.measures[] | select(.metric=="code_smells") | .value' sonar-report.json)
          echo "bugs=$BUGS" >> $GITHUB_OUTPUT
          echo "vulnerabilities=$VULNERABILITIES" >> $GITHUB_OUTPUT
          echo "code_smells=$CODE_SMELLS" >> $GITHUB_OUTPUT
      - name: Upload SonarCloud report
        uses: actions/upload-artifact@v4
        with:
          name: sonar-report
          path: sonar-report.json
  build_image:
    name: Build the docker image and save in artifacts
    runs-on: ubuntu-latest
    needs: ['sonar_scan', 'checking_k8s_manifest','owasp_dependency_check', 'git_leaks_scan']
    outputs:
      short_sha: ${{ steps.sha.outputs.SHORT_SHA }}
    steps:
      - name: Checking out the code
        uses: actions/checkout@v4
      - name: Setup short SHA for later use
        id: sha
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::10}" >> $GITHUB_OUTPUT
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "${{ vars.DOCKER_USERNAME }}"
          password: "${{ secrets.DOCKER_PASSWORD }}"
      - name: Build the docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: biswarup007/python-app:${{ steps.sha.outputs.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save image to tar
        run: |
          docker save biswarup007/python-app:${{ steps.sha.outputs.SHORT_SHA }} \
            -o python-app.tar
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
            name: python-app-image
            path: python-app.tar
  scan_image:
    name: Scan the image with Trivy
    needs: build_image
    runs-on: ubuntu-latest
    outputs:
      critical: ${{ steps.trivy_metrics.outputs.critical }}
      high: ${{ steps.trivy_metrics.outputs.high }}
      medium: ${{ steps.trivy_metrics.outputs.medium }}
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app-image
      - name: Load docker image
        run: |
          docker load -i python-app.tar
      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: ${{ runner.os }}-trivy-db

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: biswarup007/python-app:${{ needs.build_image.outputs.short_sha }}
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: 0 # in production this can be turned to 1, now it is 0 to show the entire pipeline
          format: json
          output: trivy-report.json
      - name: Parse Trivy metrics
        id: trivy_metrics
        run: |
          CRITICAL=$(jq '[.Results[].Vulnerabilities[] | select(.Severity=="CRITICAL")] | length' trivy-report.json)
          HIGH=$(jq '[.Results[].Vulnerabilities[] | select(.Severity=="HIGH")] | length' trivy-report.json)
          MEDIUM=$(jq '[.Results[].Vulnerabilities[] | select(.Severity=="MEDIUM")] | length' trivy-report.json)
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "medium=$MEDIUM" >> $GITHUB_OUTPUT

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
  sending_slack_notitification:
    name: Sending notification
    needs: ['checking_k8s_manifest', 'git_leaks_scan', 'owasp_dependency_check', 'sonar_scan','build_image','scan_image']
    uses: ./.github/workflows/reusable-slack-notification.yml
    if: always() && !failure()
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    with:
      payload: |
        text: ":rocket: *GitHub Actions Notification*"
        blocks:
          - type: section
            text:
              type: mrkdwn
              text: ":rocket: *GitHub Actions Notification*"
          - type: section
            fields:
              - type: mrkdwn
                text: "*Repository:*\n${{ github.repository }}"
              - type: mrkdwn
                text: "*Branch:*\n${{ github.ref_name }}"
              - type: mrkdwn
                text: "*Commit:*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|View Commit>"
              - type: mrkdwn
                text: "*Triggered by:*\n${{ github.actor }}"
          - type: section
            text:
              type: mrkdwn
              text: ":docker: Docker image built, scanned & pushed\n:kubernetes: Deployment YAML updated\n:rocket: *Ready for ArgoCD sync!*"
          - type: section
            fields:
              - type: mrkdwn
                text: "*Trivy CRITICAL:*\n${{ needs.scan_image.outputs.critical }}"
              - type: mrkdwn
                text: "*Trivy HIGH:*\n${{ needs.scan_image.outputs.high }}"
              - type: mrkdwn
                text: "*Trivy MEDIUM:*\n${{ needs.scan_image.outputs.medium }}"
  pushing_image_to_docker_hub:
    name: Pushing the image to docker hub
    needs: ['sending_slack_notitification', 'build_image']
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app-image
      - name: Load docker image
        run: |
          docker load -i python-app.tar
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "${{ vars.DOCKER_USERNAME }}"
          password: "${{ secrets.DOCKER_PASSWORD }}"
      - name: Push docker image
        run: docker push biswarup007/python-app:${{ needs.build_image.outputs.short_sha }}
  changing_the_kubernetes_deployment_and_commit:
    name: Changing the kubernetes deployment file
    needs: pushing_image_to_docker_hub
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checking out the code
        uses: actions/checkout@v4
      - name: Installing yq
        uses: mikefarah/yq@v4.44.3
      - name: Update deployment.yml file
        run: |
          # Creating the SHA KEY
          SHORT_SHA_KEY=${GITHUB_SHA::10}
          # Update the image tag in the kubernetes deployment yaml file
          yq -i '.spec.template.spec.containers[0].image = "biswarup007/python-app:'"$SHORT_SHA_KEY"'"' ./k8s/deployment.yml
      - name: Commiting the changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@noreply"
          git commit -am "updated the deployment.yml file by GitHub Actions" || echo "Already commited the changes"
          git push origin main
  checking_k8s_manifest_after_commit:
    name: Checking the manifests at last
    needs: changing_the_kubernetes_deployment_and_commit
    uses: ./.github/workflows/validate-kubernetes-file.yml    
  success_notify:
    name: Sending pipeline success notification
    uses: ./.github/workflows/reusable-slack-notification.yml
    needs: ['checking_k8s_manifest', 'git_leaks_scan', 'sonar_scan', 'build_image', 'scan_image','sending_slack_notitification', 'pushing_image_to_docker_hub', 'changing_the_kubernetes_deployment_and_commit', 'checking_k8s_manifest_after_commit']
    if: always() && !failure()
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    with:
      payload: |
        {
        "text": ":white_check_mark: *CI Pipeline Successful!* 🎉\n\n*Repository:* `${{ github.repository }}`\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>`\n*Triggered by:* `${{ github.actor }}`\n\n:docker: Docker image built, scanned & pushed\n:kubernetes: Deployment YAML updated\n\n:rocket: *Ready for ArgoCD sync!*"
        }
  failure_notify:
    name: Sending pipeline failure notification
    uses: ./.github/workflows/reusable-slack-notification.yml
    needs: ['checking_k8s_manifest', 'git_leaks_scan', 'sonar_scan', 'build_image', 'scan_image','sending_slack_notitification', 'pushing_image_to_docker_hub', 'changing_the_kubernetes_deployment_and_commit', 'checking_k8s_manifest_after_commit']
    if: failure()
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    with:
      payload: |
        {
        "text": ":rotating_light: *CI Pipeline FAILED!* :x:\n\n*Repository:* `${{ github.repository }}`\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>`\n*Triggered by:* `${{ github.actor }}`\n\n:warning: One or more steps failed during the pipeline execution.\n\n:mag: *Action Required*\n• Check the GitHub Actions logs\n• Fix the issue and re-run the pipeline\n\n:link: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Logs>"
        }
